<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF"-8> 
    <meta name="description" content="INRI Project - Dijital Sosyal Bilimler Portal Sitesi">
    <meta name="keywords" content="inri archive, inri, osmanlıca, belge, çeviri, eski, dijital, dijitalleştirme, portal">
    <title>INRI Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="icon" type="image/x-icon" href="favicon.jpg">

<style>

    .anaresim {
        display: flex;
        justify-content: center;
    }

    .yazi {
        display: flex;
        justify-content: center;
        font-size: small;
    }

    .inria {
        display: flex;
        justify-content: center;
    }

    .augus {
        position: fixed; 
        bottom: 0px;       
        left: 90%;          
        transform: translateX(-50%); 
        z-index: 9999; 
    }

    .disco {
        position: fixed; 
        bottom: 0px;       
        left: 10%;          
        transform: translateX(-50%); 
        z-index: 9999; 
    }

    h3 {
        display: flex;
        justify-content: center;
        color:#6b1010
    }

    a {
        text-decoration: none;
        color: black;
        font-size: 50px;
    }

    a:hover {
        color: #585858;
    }

    @media screen and (max-width: 768px) {
        .disco {
            display: none !important;
        }

        .augus {
            display: none !important;
        }

        .yazi {
            display: flex;
            justify-content: center;
            font-size: 18px;
        }
    }


</style>

<body>

    <div class="anaresim">
        <img src="INRIPro.png" width="350">
    </div>

    <div class="augus">
        <img src="augus.png" width="350">
    </div>

    <div class="disco">
        <img src="disco.png" width="350">
    </div>

    <div class="yazi">
        <h2><em>INRI Project, Dijtal Sosyal Bilimler alanında Türkiye'de faaliyet gösteren bir projedir. </em> <em>Amacımız Türkiye'de bulunan <br> tarihi eserlerin, belgelerin ve yerlerin dijitalleştirilmesi ve görüntülenmeye hazır bir şekilde paylaşılmasıdır.</em></h2>
    </div>

    <h3>PROJELERİMİZ</h3>

    <div class="inria">
        <a href="https://inriarchive.com">INRI Archive</a>
    </div>
